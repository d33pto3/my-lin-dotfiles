##### ===== BASIC SETTINGS ===== #####

set -g mouse on
set -g history-limit 50000

# Start indexing from 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Better terminal support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Better session naming behavior
set-option -g base-index 1
set-window-option -g pane-base-index 1

##### ===== SPLITS ===== #####

# Split panes easily
bind | split-window -h
bind - split-window -v

##### ===== RELOAD CONFIG ===== #####

bind r source-file ~/.tmux.conf \; display-message "Config reloaded 🚀"

##### ===== NAVIGATION (OPTIONAL BUT USEFUL) ===== #####

# Move between panes using Alt + arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

##### ===== PANE STYLING ===== #####

# Pane borders
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#a6e3a1"

##### ===== STATUS BAR ===== #####

# Position & alignment
set -g status-position bottom
set -g status-justify centre

# Colors (Catppuccin Mocha style)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side (session name)
set -g status-left-length 50
set -g status-left "#[fg=#1e1e2e,bg=#a6e3a1,bold] #S #[fg=#a6e3a1,bg=#1e1e2e]"

# Right side (time + date)
set -g status-right-length 50
set -g status-right "#[fg=#1e1e2e,bg=#89b4fa] %H:%M #[fg=#89b4fa,bg=#f9e2af]#[fg=#1e1e2e,bg=#f9e2af] %d-%b "

# Window styling
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "
set -g window-status-current-style "bold"

##### ===== SCROLLING ===== #####

# Enable better scrolling
setw -g mode-keys vi

##### ===== PERFORMANCE ===== #####

# Faster escape time (important for vim users)
set -sg escape-time 10