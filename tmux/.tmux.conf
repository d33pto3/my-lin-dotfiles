set -g mouse on
set -g set-clipboard on

set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh

set -sg escape-time 10
set -g focus-events on

set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path} (#{pane_current_command})"

# -- true color support (needed for nvim themes to render correctly in tmux) ---
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

# -- pane splits that keep your current working directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- seamless nvim <-> tmux pane navigation ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# -- vim-style pane resizing (prefix + H/J/K/L) ---
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# -- start windows/panes at 1, not 0 (matches keyboard layout) ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# -- increase scrollback ---
set -g history-limit 50000

# --- reload config keybinding ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Catppuccin theme configuration
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Force active window to fill the entire pill badge
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_default_fill "all"

# Unified text format for both states
# set -g @catppuccin_window_text " #{b:pane_current_path} (#{pane_current_command}#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/: /'))"
# set -g @catppuccin_window_current_text " #{b:pane_current_path} (#{pane_current_command}#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/: /'))"
set -g @catppuccin_window_text " #{pane_current_command}#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/: /')"
set -g @catppuccin_window_current_text " #{pane_current_command}#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/: /')"

# --- FORCE CENTERED WINDOW LIST ---
set -g status-justify absolute-centre

# Status bar options & modules
set -g status-right-length 100
set -g status-left-length 100
set -g @catppuccin_session_icon " "

set -g status-right " #{E:@catppuccin_status_directory}"
#set -g status-right " #[fg=#{@thm_surface_0}]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{b:pane_current_path} #[fg=#{@thm_crust},bg=#{@thm_rosewater}]#[fg=#{@thm_rosewater}]:"
set -g status-left "#{E:@catppuccin_status_session}#[bg=default] "

# -- plugin manager (tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# -- resurrect/continuum: auto-save & restore sessions across reboots ---
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# -- initialize tpm (keep this line at the very bottom of tmux.conf) ---
run '~/.tmux/plugins/tpm/tpm'
